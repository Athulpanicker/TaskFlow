{% extends "base.html" %}

{% block title %}
Register - TaskFlow
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>Create Account</h1>

    <p>
        Create your TaskFlow account.
    </p>


    <form method="POST">

        {% csrf_token %}


        <div class="form-group">

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Confirm Password
            </label>

            <input
                type="password"
                name="confirm_password"
                required
            >

        </div>


        <button type="submit">
            Create Account
        </button>

    </form>


    <p class="form-footer">

        Already have an account?

        <a href="{% url 'login' %}">
            Login
        </a>

    </p>

</div>

{% endblock %}

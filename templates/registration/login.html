{% extends "base.html" %}


{% block title %}
Login - TaskFlow
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>Welcome Back</h1>

    <p>
        Login to your TaskFlow account.
    </p>


    <form method="POST">

        {% csrf_token %}


        <div class="form-group">

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                required
            >

        </div>


        <button type="submit">
            Login
        </button>

    </form>


    <p class="form-footer">

        Don't have an account?

        <a href="{% url 'register' %}">
            Create account
        </a>

    </p>

</div>

{% endblock %}

{% extends "base.html" %}


{% block title %}
Change Password - TaskFlow
{% endblock %}


{% block content %}

<div class="profile-container">

    <div class="profile-header">

        <h1>
            Change Password
        </h1>

        <p>
            Update your TaskFlow account password.
        </p>

    </div>


    <div class="profile-card">

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}


            <div class="profile-actions">

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Change Password
                </button>


                <a
                    href="{% url 'profile' %}"
                    class="btn-secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}

{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block title %}TaskFlow{% endblock %}</title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            TaskFlow
        </div>

        <div class="nav-links">

            {% if user.is_authenticated %}

                <a href="{% url 'dashboard' %}">
                    Dashboard
                </a>

                 <a href="{% url 'project_list' %}">
                    Projects
                </a>
                <a href="{% url 'profile' %}">
                    Profile
                </a>
                <a href="{% url 'logout' %}">
                    Logout
                </a>

            {% else %}

                <a href="{% url 'login' %}">
                    Login
                </a>

                <a href="{% url 'register' %}">
                    Register
                </a>

            {% endif %}

        </div>

    </nav>


    <main class="container">

        {% if messages %}

    {% for message in messages %}

        <div class="alert js-message">
            {{ message }}
        </div>

    {% endfor %}

{% endif %}


        {% block content %}

        {% endblock %}

    </main>


    <script src="{% static 'js/main.js' %}">
    </script>
<script src="{% static 'js/main.js' %}"></script>
</body>

</html>

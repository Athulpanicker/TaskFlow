{% extends "base.html" %}


{% block title %}
Delete Task - TaskFlow
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>
        Delete Task
    </h1>

    <p>
        Are you sure you want to delete
        <strong>{{ task.title }}</strong>?
    </p>

    <p>
        This action cannot be undone.
    </p>


    <form method="POST">

        {% csrf_token %}

        <button
            type="submit"
            class="btn-danger"
        >
            Yes, Delete
        </button>

        <a
            href="{% url 'task_list' project.id %}"
            class="btn-secondary"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}

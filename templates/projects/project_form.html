{% extends "base.html" %}


{% block title %}
{{ title }} - TaskFlow
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>
        {{ title }}
    </h1>


    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}


        <button type="submit">
            Save Project
        </button>

    </form>


    <p class="form-footer">

        <a href="{% url 'project_list' %}">
            ← Back to Projects
        </a>

    </p>

</div>

{% endblock %}

{% extends "base.html" %}


{% block title %}
Delete Project - TaskFlow
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>
        Delete Project
    </h1>


    <p>
        Are you sure you want to delete
        <strong>{{ project.name }}</strong>?
    </p>


    <p>
        This action cannot be undone.
    </p>


    <form method="POST">

        {% csrf_token %}


        <button
            type="submit"
            class="btn-danger"
        >
            Yes, Delete
        </button>


        <a
            href="{% url 'project_detail' project.id %}"
            class="btn-secondary"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
